<!DOCTYPE html>
<html>
<head>
    <title>Selenium Locator Practice</title>
</head>

<body>

    <h1>Locator Practice Page</h1>


    <h2>ID Locator</h2>

    <input type="text"
           id="username"
           placeholder="Enter Username">

    <input type="password"
           id="password"
           placeholder="Enter Password">

    <button id="loginBtn">Login</button>



    <h2>Name Locator</h2>

    <input type="text"
           name="firstName"
           placeholder="First Name">

    <input type="email"
           name="email"
           placeholder="Email">

    <input type="text"
           name="city"
           placeholder="City">

    <button name="submitButton">Submit</button>


    <h2>Link Text Locator</h2>

    <a href="https://www.google.com">Google</a><br><br>

    <a href="https://www.facebook.com">Facebook</a><br><br>

    <a href="https://www.selenium.dev">
        Selenium Official Website
    </a><br><br>

    <a href="https://www.github.com">
        GitHub Repository
    </a>

    <h2>Class Name Locator</h2>

    <button class="login-button">Login Button</button>

    <button class="register-button">Register Button</button>

    <button class="search-button">Search Button</button>




</body>
</html>
